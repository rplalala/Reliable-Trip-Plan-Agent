schema_version: 3

app:
  time_zone: Australia/Sydney

budget:
  candidates: 20
  places:
    search_calls: 4
    detail_calls: 8
  weather:
    calls: 2
  routes:
    matrix_elements: 64
    alternative_pairs: 8
    alternative_matrix_calls: 8
  web:
    evidence_tasks: 6
    page_fetches: 6
  experience:
    review_enriched_places: 3

web_evidence:
  reasoning_effort: low
  max_tool_calls: 2
  search_context_size: low
  timeout_seconds: 20
  authority_domain_overrides: []
  page_retrieval:
    max_targets_per_need: 2
    max_redirects: 2
    timeout_seconds: 10
    max_response_bytes: 262144
    max_text_chars: 20000
  claim_extraction:
    max_native_sources: 3
    max_native_snippet_chars: 1200
    max_candidates_per_call: 3
    max_calls_per_need: 3
    max_extraction_output_units: 1200

logging:
  level: INFO
  console: true

trace:
  enabled: true
  directory: logs
  payload_level: metadata
  capture_llm: true
  capture_tools: true
  capture_evidence: true
  raw_provider_payloads: false
  max_payload_bytes: 1000000
