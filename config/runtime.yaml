schema_version: 6
reference_discovery:
  policy_version: nearby_references_1
  max_requests: 3
  max_result_count: 10
  radius_metres: 800
  anchor_reuse_metres: 300
  deadline_seconds: 10
  request_timeout_seconds: 4
  retries: 0
  max_references: 3
  rank_preference: DISTANCE
  included_types:
  - restaurant
  - cafe
  - park
  - museum
app:
  time_zone: Australia/Sydney
budget:
  candidates: 64
  final_pois: 20
  places:
    destination_search_calls: 1
    candidate_search_calls: 12
    detail_calls: 40
    review_detail_calls: 8
  weather:
    calls: 2
  routes:
    matrix_elements: 64
    baseline_elements_per_request: 64
    baseline_elements_per_run: 400
    baseline_calls: 7
    alternative_pairs: 16
    alternative_matrix_calls: 16
    alternative_elements: 16
  web:
    evidence_tasks: 8
    page_fetches: 8
  experience:
    review_enriched_places: 8
    profile_llm_calls: 8
web_evidence:
  reasoning_effort: low
  max_tool_calls: 2
  search_context_size: low
  timeout_seconds: 20
  authority_domain_overrides: []
  page_retrieval:
    max_targets_per_need: 2
    max_redirects: 2
    timeout_seconds: 10
    max_response_bytes: 262144
    max_text_chars: 20000
  claim_extraction:
    max_native_sources: 3
    max_native_snippet_chars: 1200
    max_candidates_per_call: 3
    max_calls_per_need: 3
    max_extraction_output_units: 1200
logging:
  level: INFO
  console: true
trace:
  enabled: true
  directory: logs
  payload_level: metadata
  capture_llm: true
  capture_tools: true
  capture_evidence: true
  raw_provider_payloads: false
  max_payload_bytes: 1000000
tripworld_discovery:
  version: tripworld_runtime_1
  top_k: 20
  resolution_entities: 16
  details_calls: 20
  fallback_calls: 4
  radius_km: 15
  identity_radius_km: 1
  deadline_seconds: 360
  embedding_timeout: 8
  sql_timeout: 60
  connect_timeout: 10
  google_timeout: 4
  retries: 0
  max_queries: 4
  max_positions: 80
  total_query_tokens: 2048
acquisition:
  policy_id: quality_first_1
  details_deadline_seconds: 120
  details_timeout_seconds: 20
main_generation:
  enabled: true
  input_tokens: 160000
  output_tokens: 16384
  framing_tokens: 2048
development_timeout_seconds: 600

# V3-only development policy. Acquisition totals are shared across all rounds.
v3_repair:
  max_rounds: 3
  max_model_calls: 3 # One call per round; zero disables model attempts.
  quantity_review_enabled: false # CLI may explicitly override this review policy.
  repetition_review_enabled: false # Same-canonical review; never a confirmed fact conflict.
  overfull_review_enabled: false # Independent from shortage review.
  daily_main_min: 2 # Application coverage reference, not an unconditional quota.
  daily_main_max: 5 # Review target permits exactly this many distinct main POIs.
  move_max_days: 1 # Per move from the original activity date; 0 disables automatic moves.
  blank_day_start_hour: 9 # Destination-local; only originally empty/missing dates.
  blank_day_end_hour: 18 # Exclusive local endpoint; fixed time has precedence.
  alternatives_per_gap: 2 # Preparation reference, not an acceptance requirement.
  exploration_positions: 2 # Stage-wide reusable positions within the same ID union.
  timing:
    stage_seconds: 300
    round_seconds: 120
    model_seconds: 70
    preparation_seconds: 30
    recheck_reserve_seconds: 20
    minimum_model_seconds: 30
    round_reference_seconds: 60
    finalization_reserve_seconds: 1
    # Nearby reservation uses reference_discovery.deadline_seconds above.
  input:
    input_tokens: 64000
    output_tokens: 16384
    framing_tokens: 2048
    identity_capacity: 28 # Scheduled context UNION operation candidates, per call.
    activity_capacity: 120
    candidate_characters: 12000
    feedback_characters: 12000
  acquisition:
    google: 2 # Includes fallback sends; cache hits do not consume sends.
    fallback: 1
    embedding: 1
    retrieval: 1
    canonical: 8 # Processing attempts, including failed attempts.
    details: 8
    routes: 4
    elements: 32 # Actual origin count times destination count, not returned rows.
    top_k: 10
    provider_timeout_seconds: 20
  spatial:
    walk_radius_km: 2
    motor_radius_km: 5
    max_leg_minutes: 45
    detour_floor_km: 1
    detour_ratio: 0.5
    fallback_distance_km: 1
    fallback_reserve_minutes: 45 # Schedule reserve, not measured travel duration.
    daily_added_minutes: 90 # Cumulative per day against the stage-original itinerary.
